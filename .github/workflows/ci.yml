name: Linux CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y g++ make libssl-dev
      - name: Build VEYRA
        run: make clean && make -j2
      - name: Verify syntax of all examples
        run: for file in examples/*.vey; do ./veyra --check "$file"; done
      - name: Run regression tests
        run: make test
